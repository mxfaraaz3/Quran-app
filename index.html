<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quran App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME PAGE -->
    <div class="page active" id="home">
        <div class="content-wrapper">
            <div class="header">
                <div class="greeting">
                    <div class="greeting-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 9 9c0 .5-.05 1-.1 1.5A9 9 0 0 1 3 12a9 9 0 0 0 9-9z"/><circle cx="17" cy="5" r="1.5"/></svg>
                    </div>
                    <div class="greeting-text">
                        <h1>Assalamu Alaikum</h1>
                        <p>May Allah bless your day</p>
                    </div>
                </div>
            </div>
            
            <div class="bismillah-header">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
            </div>
            
            <div class="continue-card" onclick="openLast()">
                <div class="continue-icon">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div class="continue-info">
                    <h3 id="contName">Aayat Kursi</h3>
                    <p id="contMean">Al-Baqara • Ayat 255</p>
                </div>
            </div>
            
            <div class="section-label">Surahs</div>
            <div id="surahList"></div>
        </div>
    </div>

    <!-- Reading Page -->
    <div class="page" id="read"></div>
    <div class="page" id="bookmark"></div>
    <div class="page" id="last"></div>
    <div class="page" id="settings"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="go('home')">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="go('bookmark')">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>Bookmark</span>
        </button>
        <button class="nav-btn" onclick="go('last')">
            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>Last Read</span>
        </button>
        <button class="nav-btn" onclick="go('settings')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
