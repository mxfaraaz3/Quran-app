<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quran App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HOME PAGE -->
    <div class="page active" id="home">
        <div class="content-wrapper">
            <div class="header">
                <div class="greeting">
                    <div class="greeting-icon">
                        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 9 9c0 .5-.05 1-.1 1.5A9 9 0 0 1 3 12a9 9 0 0 0 9-9z"/><circle cx="17" cy="5" r="1.5"/></svg>
                    </div>
                    <div class="greeting-text">
                        <h1>Assalamu Alaikum</h1>
                        <p>May Allah bless your day</p>
                    </div>
                </div>
            </div>
            
            <div class="bismillah-header">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
            
            <div class="continue-card" onclick="openLast()">
                <div class="continue-icon">
                    <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                </div>
                <div class="continue-info">
                    <h3 id="contName">Aayat Kursi</h3>
                    <p id="contMean">Al-Baqara • Ayat 255</p>
                </div>
            </div>
            
            <div class="section-label">Surahs</div>
            <div id="surahList"></div>
        </div>
    </div>

    <!-- READING PAGE -->
    <div class="page" id="read">
        <div class="read-header">
            <div class="back-btn" onclick="go('home')">←</div>
            <div class="read-title">
                <h2 id="readArabic"></h2>
                <p id="readEnglish"></p>
            </div>
        </div>
        
        <div class="bismillah-read">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div id="ayahs"></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="go('home')">Home</button>
        <button class="nav-btn" onclick="go('bookmark')">Bookmark</button>
        <button class="nav-btn" onclick="go('last')">Last Read</button>
        <button class="nav-btn" onclick="go('settings')">Settings</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
